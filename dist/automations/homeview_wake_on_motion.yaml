# Settings > Automations > Create automation > three dots > Edit in YAML > paste > Save
alias: HomeView iPad - Wake screensaver on motion
description: Stops the WallPanel clock screensaver when someone walks up to the iPad.
mode: single
triggers:
- trigger: state
  entity_id: binary_sensor.your_motion_or_presence_sensor
  to: 'on'
conditions:
- condition: state
  entity_id: input_boolean.homeview_screensaver
  state: 'on'
actions:
- action: input_boolean.turn_off
  target:
    entity_id: input_boolean.homeview_screensaver
