            '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
            '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'],
            '-': ['000', '000', '000', '111', '000', '000', '000'],
            ':': ['0', '0', '1', '0', '1', '0', '0'],
            '°': ['010', '101', '010', '000', '000', '000', '000'],
            '%': ['11001', '11010', '00010', '00100', '01000', '01011', '10011'],
            ' ': ['00', '00', '00', '00', '00', '00', '00'],
          };
          const chars = String(text).split('');
          const P = o.pitch;
          const R = ((P * o.dot) / 2).toFixed(2);
          let x = 0;
          let dots = '';
          chars.forEach((ch) => {
            const g = G[ch] || G[' '];
            const colour = ch === ':' ? o.accent : o.on;
            for (let r = 0; r < 7; r++) {
              for (let c = 0; c < g[r].length; c++) {
                const lit = g[r][c] === '1';
                if (!lit && !o.off) continue;
                dots += '<circle cx="' + ((x + c) * P + P / 2).toFixed(1) + '" cy="' + (r * P + P / 2).toFixed(1) +
                        '" r="' + R + '" fill="' + (lit ? colour : o.off) + '"/>';
              }
            }
            x += g[0].length + 1;
          });
          const w = Math.max(0, x - 1) * P;
          return '<svg width="' + w + '" height="' + 7 * P + '" viewBox="0 0 ' + w + ' ' + 7 * P +
                 '" style="display:block;overflow:visible">' + dots + '</svg>';
        };
          const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const parse = (s) => { if (!s) return null; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? null : d; };
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const dayLabel = (d) => {
            const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 86400000);
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Tomorrow';
            return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
          };
          const time = (d) => (d ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '');
          const rows = (variables.calendars || []).map((cal) => {
            const st = states[cal.entity];
            const a = st ? st.attributes : {};
            const start = parse(a.start_time), end = parse(a.end_time);
            const live = !!(st && st.state === 'on');
            let when = '';
            if (live) when = a.all_day ? 'Now · all day' : 'Now · until ' + time(end);
            else if (start) when = dayLabel(start) + (a.all_day ? ' · all day' : ' · ' + time(start));
            return { cal: cal, title: a.message, when: when, key: live ? 0 : (start ? start.getTime() : Number.MAX_VALUE) };
          }).filter((r) => r.title);
          rows.sort((x, y) => x.key - y.key);
          if (Number(variables.max) > 0) rows.length = Math.min(rows.length, Number(variables.max));
          const line = (r) =>
            '<div style="display:flex;gap:10px;min-width:0;">' +
              '<span style="flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px;background:' + (r.cal.color || ACCENT) + ';"></span>' +
