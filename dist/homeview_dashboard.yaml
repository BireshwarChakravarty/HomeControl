                '<div style="font-size:11px;opacity:.65;margin-top:4px;white-space:nowrap;">' + hilo + '</div>' +
              '</div>' +
            '</div>' + tempBar + '<div style="height:8px;"></div>' + rainBar;
        ]]]
  hv_calendar:
