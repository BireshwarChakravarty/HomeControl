    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: 0px
      - padding: 14px
      - cursor: default
      - overflow: visible
