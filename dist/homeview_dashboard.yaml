# HomeView iPad panel - GENERATED by homeview/build_dashboard.py, don't edit by hand.
# Paste into: Settings > Dashboards > (dashboard at /homeview) > pencil > three dots >
#             Raw configuration editor  (replace everything, then Save).
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  entity_settings:
  - entity:
      input_boolean.homeview_kiosk: 'on'
    hide_header: true
    hide_sidebar: true
wallpanel:
  enabled: true
  hide_toolbar: false
  hide_sidebar: false
  fullscreen: false
  idle_time: 120
  fade_in_time: 2
  show_images: false
  keep_screen_on_time: 0
  black_screen_after_time: 0
  control_reactivation_time: 1
  screensaver_entity: input_boolean.homeview_screensaver
  screensaver_stop_navigation_path: /homeview/home
  style:
    wallpanel-screensaver-info-box:
      --wp-card-width: 620px
      background: transparent
    wallpanel-screensaver-info-box-content:
      background: transparent
  cards:
  - type: custom:button-card
    template: hv_clock
    variables:
      pitch: 22
    hold_action:
      action: none
    styles:
      card:
      - background: transparent
      - border: none
      - -webkit-backdrop-filter: none
      - backdrop-filter: none
      - height: 300px
button_card_templates:
  hv_base:
    styles:
      card:
      - background: rgba(28, 28, 30, 0.62)
      - -webkit-backdrop-filter: blur(10px) saturate(140%)
      - backdrop-filter: blur(10px) saturate(140%)
      - border: 1px solid rgba(255, 255, 255, 0.08)
      - border-radius: 28px
      - box-shadow: none
      - color: '#F2F2F2'
      - font-family: ui-monospace, "SF Mono", Menlo, monospace
      - text-transform: uppercase
      - letter-spacing: 0.14em
      - transition: background-color 0.25s ease, color 0.25s ease
      - -webkit-tap-highlight-color: transparent
  hv_bright_when_on:
    state:
    - id: bright
      value: ^(on|playing)$
      operator: regex
      styles:
        card:
        - background: rgba(236, 236, 236, 0.94)
        - border: 1px solid rgba(255, 255, 255, 0.95)
        - color: '#111111'
    - id: unavailable
      value: ^(unavailable|unknown)$
      operator: regex
      styles:
        card:
        - opacity: '0.4'
  hv_flat:
    styles:
      card:
      - background: none
      - border: none
      - box-shadow: none
      - -webkit-backdrop-filter: none
      - backdrop-filter: none
      - border-radius: 0px
      - padding: 0px
      - color: inherit
      - font-family: ui-monospace, "SF Mono", Menlo, monospace
      - text-transform: uppercase
      - letter-spacing: 0.14em
      - -webkit-tap-highlight-color: transparent
