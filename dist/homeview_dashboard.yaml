    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#weather'
        name: Weather
        icon: mdi:weather-partly-cloudy
        width_desktop: 640px
        bg_color: '#111113'
        bg_opacity: '94'
        bg_blur: '0'
      - type: weather-forecast
        entity: weather.forecast_home
        forecast_type: hourly
        show_current: true
        show_forecast: true
      - type: weather-forecast
        entity: weather.forecast_home
        forecast_type: daily
        show_current: false
        show_forecast: true
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#calendar'
        name: This week
        icon: mdi:calendar-month
        width_desktop: 760px
        bg_color: '#111113'
        bg_opacity: '94'
        bg_blur: '0'
      - type: calendar
        initial_view: listWeek
        entities:
        - calendar.your_icloud_calendar
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#cam-1'
        name: Camera 1
        icon: mdi:cctv
        width_desktop: 900px
        bg_color: '#111113'
        bg_opacity: '94'
        bg_blur: '0'
        trigger:
        - condition: state
          entity: input_boolean.homeview_cam_1_alert
          state: 'on'
        trigger_close: true
        auto_close: '30000'
      - type: picture-entity
        entity: camera.your_camera_1_hd_stream
        camera_view: live
        show_state: false
        show_name: false
        tap_action:
          action: none
        hold_action:
          action: none
      - type: horizontal-stack
        cards:
        - type: custom:button-card
          template: hv_pill
          name: Next camera
          icon: mdi:chevron-right
          tap_action:
            action: navigate
            navigation_path: '#cam-2'
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#cam-2'
        name: Camera 2
        icon: mdi:cctv
        width_desktop: 900px
        bg_color: '#111113'
        bg_opacity: '94'
        bg_blur: '0'
        trigger:
