              '</div>' +
            '</div>';
          const body = rows.length ? rows.map(line).join('')
            : '<div style="font-size:12px;opacity:.5;">Nothing coming up</div>';
          return lbl('Up next') + '<div style="display:flex;flex-direction:column;gap:12px;margin-top:14px;">' + body + '</div>';
