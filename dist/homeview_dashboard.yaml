          '<span style="flex:none;width:7px;height:7px;border-radius:50%;background:' + ACCENT + ';"></span>' +
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;">' + t + '</span>' +
          (right ? '<span style="flex:none;">' + right + '</span>' : '') + '</div>';

        const dm = (text, opt) => {
          const o = Object.assign({ pitch: 10, dot: 0.74, on: '#F2F2F2', off: null, accent: ACCENT }, opt || {});
          const G = {
            '0': ['01110', '10001', '10011', '10101', '11001', '10001', '01110'],
            '1': ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
            '2': ['01110', '10001', '00001', '00010', '00100', '01000', '11111'],
            '3': ['11110', '00001', '00001', '01110', '00001', '00001', '11110'],
            '4': ['00010', '00110', '01010', '10010', '11111', '00010', '00010'],
            '5': ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
            '6': ['00110', '01000', '10000', '11110', '10001', '10001', '01110'],
            '7': ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
            '8': ['01110', '10001', '10001', '01110', '10001', '10001', '01110'],
            '9': ['01110', '10001', '10001', '01111', '00001', '00010', '01100'],
            '-': ['000', '000', '000', '111', '000', '000', '000'],
            ':': ['0', '0', '1', '0', '1', '0', '0'],
            '°': ['010', '101', '010', '000', '000', '000', '000'],
            '%': ['11001', '11010', '00010', '00100', '01000', '01011', '10011'],
            ' ': ['00', '00', '00', '00', '00', '00', '00'],
          };
          const chars = String(text).split('');
          const P = o.pitch;
          const R = ((P * o.dot) / 2).toFixed(2);
          let x = 0;
          let dots = '';
          chars.forEach((ch) => {
            const g = G[ch] || G[' '];
            const colour = ch === ':' ? o.accent : o.on;
            for (let r = 0; r < 7; r++) {
              for (let c = 0; c < g[r].length; c++) {
                const lit = g[r][c] === '1';
                if (!lit && !o.off) continue;
                dots += '<circle cx="' + ((x + c) * P + P / 2).toFixed(1) + '" cy="' + (r * P + P / 2).toFixed(1) +
                        '" r="' + R + '" fill="' + (lit ? colour : o.off) + '"/>';
              }
            }
            x += g[0].length + 1;
          });
          const w = Math.max(0, x - 1) * P;
          return '<svg width="' + w + '" height="' + 7 * P + '" viewBox="0 0 ' + w + ' ' + 7 * P +
                 '" style="display:block;overflow:visible">' + dots + '</svg>';
        };
          const d = new Date();
          const tf = hass && hass.locale ? hass.locale.time_format : 'language';
          const h12 = tf === '12' ? true : tf === '24' ? false
            : !!new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions().hour12;
          let h = d.getHours();
          if (h12) h = ((h + 11) % 12) + 1;
          const txt = String(h).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
          return dm(txt, { pitch: Number(variables.pitch) || 11, off: variables.off });
        ]]]
      date: |
        [[[
          const d = new Date();
          const s = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
          return '<div style="font-size:14px;letter-spacing:.22em;opacity:.8;margin-top:12px;">' + s.toUpperCase() + '</div>';
        ]]]
  hv_weather:
    template: hv_base
    show_icon: false
    show_name: false
    show_state: false
    variables:
      forecast: sensor.homeview_weather_today
    tap_action:
