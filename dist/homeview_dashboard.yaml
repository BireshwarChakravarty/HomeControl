          let x = 0;
          let dots = '';
          chars.forEach((ch) => {
            const g = G[ch] || G[' '];
            const colour = ch === ':' ? o.accent : o.on;
            for (let r = 0; r < 7; r++) {
              for (let c = 0; c < g[r].length; c++) {
                const lit = g[r][c] === '1';
                if (!lit && !o.off) continue;
                dots += '<circle cx="' + ((x + c) * P + P / 2).toFixed(1) + '" cy="' + (r * P + P / 2).toFixed(1) +
                        '" r="' + R + '" fill="' + (lit ? colour : o.off) + '"/>';
              }
            }
            x += g[0].length + 1;
          });
          const w = Math.max(0, x - 1) * P;
          return '<svg width="' + w + '" height="' + 7 * P + '" viewBox="0 0 ' + w + ' ' + 7 * P +
                 '" style="display:block;overflow:visible">' + dots + '</svg>';
        };
          if (!entity || entity.state === 'unavailable') {
            return lbl('Weather') + '<div style="opacity:.5;margin-top:24px;">Unavailable</div>';
          }
          const icons = { 'clear-night': 'night', 'cloudy': 'cloudy', 'exceptional': 'alert-circle-outline',
            'fog': 'fog', 'hail': 'hail', 'lightning': 'lightning', 'lightning-rainy': 'lightning-rainy',
            'partlycloudy': 'partly-cloudy', 'pouring': 'pouring', 'rainy': 'rainy', 'snowy': 'snowy',
            'snowy-rainy': 'snowy-rainy', 'sunny': 'sunny', 'windy': 'windy', 'windy-variant': 'windy-variant' };
          const icon = 'mdi:weather-' + (icons[entity.state] || 'cloudy');
          const fc = states[variables.forecast];
          const fa = fc ? fc.attributes : {};
          const t = Number(entity.attributes.temperature);
          const num = (v) => (v === null || v === undefined || v === '' || isNaN(Number(v)) ? null : Number(v));
          const hi = num(fa.high), lo = num(fa.low), chance = num(fa.rain_chance), mm = num(fa.rain_mm);
          const cond = String(hass.formatEntityState ? hass.formatEntityState(entity) : entity.state).toUpperCase();
          const N = 28;
          const dots = (fill, colour, marker) => {
            let s = '';
            for (let i = 0; i < N; i++) {
              if (marker !== null && i === marker) {
                s += '<span style="flex:none;width:3px;height:14px;border-radius:2px;background:' + ACCENT + ';"></span>';
              } else {
                s += '<span style="flex:none;width:5px;height:5px;border-radius:50%;background:' +
                     (i < fill ? colour : 'rgba(128,128,128,.35)') + ';"></span>';
              }
            }
            return '<div style="display:flex;justify-content:space-between;align-items:center;height:14px;">' + s + '</div>';
          };
          const row = (name, right, bar) =>
            '<div style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;opacity:.7;margin-bottom:5px;">' +
            '<span>' + name + '</span><span>' + right + '</span></div>' + bar;
          let lo2 = lo, hi2 = hi;
          if (lo2 === null || hi2 === null || hi2 <= lo2) { lo2 = t - 5; hi2 = t + 5; }
          const pos = Math.max(0, Math.min(1, (t - lo2) / (hi2 - lo2)));
          const m = Math.round(pos * (N - 1));
          const tempBar = row('Temp', lo !== null && hi !== null ? Math.round(lo) + '° – ' + Math.round(hi) + '°' : '',
                              dots(m, 'currentColor', m));
          let rainRight = '--', rainFill = 0;
          if (chance !== null) { rainRight = Math.round(chance) + '%'; rainFill = Math.round(chance / 100 * N); }
          else if (mm !== null) { rainRight = mm.toFixed(1) + ' mm'; rainFill = Math.round(Math.min(mm / 10, 1) * N); }
          const rainBar = row('Rain', rainRight, dots(rainFill, ACCENT, null));
          const hilo = lo !== null && hi !== null ? '&darr; ' + Math.round(lo) + '° &nbsp;&uarr; ' + Math.round(hi) + '°' : '';
          return lbl('Weather') +
            '<div style="display:flex;align-items:center;gap:12px;margin:10px 0 10px;">' +
              '<ha-icon icon="' + icon + '" style="--mdc-icon-size:30px;flex:none;"></ha-icon>' +
