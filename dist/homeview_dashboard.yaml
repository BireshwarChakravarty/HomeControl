# HomeView iPad dashboard - GENERATED by homeview/build_dashboard.py, don't edit by hand.
# Paste into: Settings > Dashboards > (dashboard at /home-widget) > pencil > three dots >
#             Raw configuration editor  (replace everything, then Save).
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
  entity_settings:
  - entity:
      input_boolean.homeview_kiosk: 'on'
    hide_header: true
    hide_sidebar: true
swipe_nav:
  wrap: false
  animate: swipe
  prevent_default: true
  swipe_amount: 15
wallpanel:
  enabled: true
  enabled_on_tabs:
  - home
  - cameras
  hide_toolbar: false
  hide_sidebar: false
  fullscreen: false
  idle_time: 120
  fade_in_time: 2
  show_images: false
  keep_screen_on_time: 0
  black_screen_after_time: 0
  control_reactivation_time: 1
  screensaver_entity: input_boolean.homeview_screensaver
  screensaver_stop_navigation_path: /home-widget/home
  style:
    wallpanel-screensaver-info-box:
      --wp-card-width: 420px
      background: transparent
    wallpanel-screensaver-info-box-content:
      background: transparent
  cards:
  - type: custom:button-card
    template: hv_clock
    variables:
      size: 380
    styles:
      card:
      - background: transparent
      - border: none
      - -webkit-backdrop-filter: none
      - backdrop-filter: none
      - height: 400px
button_card_templates:
  hv_base:
    styles:
      card:
      - background: rgba(255, 255, 255, 0.12)
      - -webkit-backdrop-filter: blur(12px) saturate(160%)
      - backdrop-filter: blur(12px) saturate(160%)
      - border: 1px solid rgba(255, 255, 255, 0.18)
      - border-radius: 24px
      - box-shadow: none
      - color: '#FFFFFF'
      - font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif
      - -webkit-tap-highlight-color: transparent
  hv_layout:
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
      - background: none
      - border: none
      - box-shadow: none
      - border-radius: '0'
      - padding: 14px
      - cursor: default
      - overflow: visible
      grid:
      - gap: 12px
      - align-items: stretch
      - justify-items: stretch
  hv_tile:
    template: hv_base
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: toggle
      haptic: light
    hold_action:
      action: more-info
    styles:
      card:
      - height: 150px
      - padding: 16px
      grid:
      - grid-template-areas: '"i badge" "n n" "s s"'
      - grid-template-columns: 1fr auto
      - grid-template-rows: 1fr min-content min-content
      img_cell:
      - justify-content: flex-start
      - align-items: flex-start
      icon:
      - width: 34px
      - color: rgba(255, 255, 255, 0.80)
      name:
      - justify-self: start
      - text-align: left
      - font-size: 15px
      - font-weight: '600'
      - padding-top: 8px
      - max-width: 100%
      state:
      - justify-self: start
      - text-align: left
      - font-size: 13px
      - font-weight: '500'
      - color: rgba(255, 255, 255, 0.60)
      - text-transform: capitalize
      custom_fields:
        badge:
        - justify-self: end
        - align-self: start
    state:
    - id: active_on
      value: 'on'
      styles:
        card:
        - background: rgba(255, 255, 255, 0.90)
        - border: 1px solid rgba(255, 255, 255, 0.95)
        icon:
        - color: '#FF9F0A'
        name:
        - color: '#1C1C1E'
        state:
        - color: '#636366'
    - id: active_cleaning
      value: ^(cleaning|returning)$
      operator: regex
      styles:
        card:
        - background: rgba(255, 255, 255, 0.90)
        icon:
        - color: '#0A84FF'
        name:
        - color: '#1C1C1E'
        state:
        - color: '#636366'
    - id: alert_unlocked
      value: ^(unlocked|unlocking|jammed|open_lock)$
      operator: regex
      styles:
        card:
        - background: rgba(255, 69, 58, 0.30)
        - border: 1px solid rgba(255, 69, 58, 0.60)
        icon:
        - color: '#FF453A'
    - id: alert_open
      value: ^(open|opening|closing)$
      operator: regex
      styles:
        card:
        - background: rgba(255, 159, 10, 0.30)
        - border: 1px solid rgba(255, 159, 10, 0.60)
        icon:
        - color: '#FF9F0A'
    - id: unavailable
      value: ^(unavailable|unknown)$
      operator: regex
      styles:
        card:
        - opacity: '0.45'
  hv_tile_small:
    styles:
      card:
      - height: 64px
      - padding: 10px 14px
      grid:
      - grid-template-areas: '"i n" "i s"'
      - grid-template-columns: 36px 1fr
      - grid-template-rows: 1fr 1fr
      - column-gap: 10px
      img_cell:
      - justify-content: center
      - align-items: center
      icon:
      - width: 26px
      name:
      - padding-top: 0px
      - align-self: end
      - font-size: 14px
      state:
      - align-self: start
      - font-size: 12px
  hv_fan_tile:
    template: hv_tile
    icon: mdi:fan
    state:
    - id: active_on
      value: 'on'
      spin: true
      styles:
        icon:
        - color: '#0A84FF'
  hv_vacuum_tile:
    template: hv_tile
    icon: mdi:robot-vacuum
    variables:
      water_low: ''
    tap_action:
      action: navigate
      navigation_path: '#vacuum'
    custom_fields:
      badge: |
        [[[
          const w = variables.water_low ? states[variables.water_low] : null;
          if (w && w.state === 'on') {
            return '<span style="display:inline-block;padding:3px 8px;border-radius:10px;background:rgba(10,132,255,.85);color:#fff;font-size:11px;font-weight:700;">Refill water</span>';
          }
          return '';
        ]]]
  hv_scene:
    template: hv_base
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: perform-action
      perform_action: homeassistant.turn_on
      target:
        entity_id: '[[[ return entity.entity_id ]]]'
      haptic: success
    hold_action:
      action: none
    styles:
      card:
      - height: 71px
      - padding: 0px 16px
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 30px 1fr
      - grid-template-rows: 1fr
      - column-gap: 12px
      - align-items: center
      icon:
      - width: 26px
      - color: rgba(255, 255, 255, 0.85)
      name:
      - justify-self: start
      - text-align: left
      - font-size: 15px
      - font-weight: '600'
  hv_pill:
    template: hv_base
    show_icon: true
    show_name: true
    show_state: false
    styles:
      card:
      - height: 64px
      - padding: 0px 14px
      grid:
      - grid-template-areas: '"i n"'
      - grid-template-columns: 32px 1fr
      - grid-template-rows: 1fr
      - column-gap: 8px
      - align-items: center
      icon:
      - width: 26px
      - color: '#FFFFFF'
      name:
      - justify-self: start
      - font-size: 15px
      - font-weight: '600'
  hv_clock:
    template: hv_base
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.time
    variables:
      size: 180
    tap_action:
      action: none
    hold_action:
      action: perform-action
      perform_action: input_boolean.toggle
      target:
        entity_id: input_boolean.homeview_kiosk
      haptic: heavy
    styles:
      card:
      - padding: 0px
      grid:
      - grid-template-areas: '"clock"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      custom_fields:
        clock:
        - justify-self: center
        - align-self: center
    custom_fields:
      clock: |
        [[[
          const S = Number(variables.size) || 180;
          const d = new Date();
          const sec = d.getSeconds() + d.getMilliseconds() / 1000;
          const min = d.getMinutes() * 60 + sec;
          const hr = (d.getHours() % 12) * 3600 + min;
          const tail = Math.round(S * 0.09);
          let ticks = '';
          for (let i = 0; i < 12; i++) {
            ticks += '<i class="hvc-t' + (i % 3 === 0 ? ' hvc-M' : '') + '" style="transform:rotate(' + (i * 30) + 'deg)"></i>';
          }
          return `
            <style>
              @keyframes hvc-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
              .hvc-f { position: relative; width: ${S}px; height: ${S}px; border-radius: 50%;
                       background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.18); }
              .hvc-t { position: absolute; left: 50%; top: 0; width: 2px; height: 50%; margin-left: -1px;
                       transform-origin: 50% 100%; }
              .hvc-t:before { content: ''; display: block; width: 2px; height: ${Math.round(S * 0.05)}px;
                              margin-top: ${Math.round(S * 0.05)}px; border-radius: 1px; background: rgba(255, 255, 255, 0.45); }
              .hvc-M:before { height: ${Math.round(S * 0.08)}px; background: #FFFFFF; }
              .hvc-h { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%;
                       border-radius: 4px; animation: hvc-spin 60s linear infinite; }
              .hvc-hr { width: 6px; margin-left: -3px; height: ${Math.round(S * 0.25)}px; background: #FFFFFF;
                        animation-duration: 43200s; animation-delay: -${hr}s; }
              .hvc-mn { width: 4px; margin-left: -2px; height: ${Math.round(S * 0.37)}px; background: #FFFFFF;
                        animation-duration: 3600s; animation-delay: -${min}s; }
              .hvc-sc { width: 2px; margin-left: -1px; height: ${Math.round(S * 0.44) + tail}px;
                        bottom: calc(50% - ${tail}px); transform-origin: 50% calc(100% - ${tail}px);
                        background: #FF9F0A; animation-duration: 60s; animation-delay: -${sec}s; }
              .hvc-c { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
                       border-radius: 50%; background: #FF9F0A; border: 2px solid #FFFFFF; box-sizing: border-box; }
            </style>
            <div class="hvc-f">${ticks}
              <div class="hvc-h hvc-hr"></div>
              <div class="hvc-h hvc-mn"></div>
              <div class="hvc-h hvc-sc"></div>
              <div class="hvc-c"></div>
            </div>`;
        ]]]
  hv_date:
    template: hv_base
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.date
    tap_action:
      action: none
    styles:
      card:
      - padding: 14px 22px
      grid:
      - grid-template-areas: '"date"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      custom_fields:
        date:
        - justify-self: start
        - align-self: center
    custom_fields:
      date: |
        [[[
          const d = new Date();
          const wd = d.toLocaleDateString(undefined, { weekday: 'long' });
          const mo = d.toLocaleDateString(undefined, { month: 'long' });
          return `
            <div style="text-align:left;line-height:1.05;">
              <div style="color:#FF453A;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;">${wd}</div>
              <div style="font-size:60px;font-weight:700;color:#FFFFFF;">${d.getDate()}
                <span style="font-size:26px;font-weight:600;opacity:.75;">${mo}</span></div>
            </div>`;
        ]]]
  hv_weather:
    template: hv_base
    show_icon: true
    show_name: false
    show_state: false
    variables:
      city: ''
      uv_entity: ''
    tap_action:
      action: navigate
      navigation_path: '#weather'
    styles:
      card:
      - background: linear-gradient(160deg, rgba(37, 99, 235, 0.55), rgba(15, 23, 42, 0.55))
      - padding: 18px 20px
      grid:
      - grid-template-areas: '"city i" "temp temp" "cond meta"'
      - grid-template-columns: 1fr auto
      - grid-template-rows: min-content 1fr min-content
      img_cell:
      - justify-content: flex-end
      - align-items: flex-start
      icon:
      - width: 40px
      - color: '#FFD60A'
      custom_fields:
        city:
        - justify-self: start
        - align-self: start
        temp:
        - justify-self: start
        - align-self: center
        cond:
        - justify-self: start
        - align-self: end
        meta:
        - justify-self: end
        - align-self: end
    custom_fields:
      city: |
        [[[
          const c = variables.city || (entity ? entity.attributes.friendly_name : '') || '';
          return `<span style="font-size:16px;font-weight:600;">${c}</span>`;
        ]]]
      temp: |
        [[[
          const t = entity ? entity.attributes.temperature : null;
          return `<span style="font-size:56px;font-weight:300;line-height:1;">${t == null ? '--' : Math.round(t)}&deg;</span>`;
        ]]]
      cond: |
        [[[
          if (!entity) return '<span style="opacity:.6">Unavailable</span>';
          const s = hass.formatEntityState ? hass.formatEntityState(entity) : entity.state;
          return `<span style="font-size:15px;opacity:.85;">${s}</span>`;
        ]]]
      meta: |
        [[[
          if (!entity) return '';
          const src = (variables.uv_entity && states[variables.uv_entity]) || entity;
          const uv = src.attributes.uv_index;
          const hum = entity.attributes.humidity;
          const parts = [];
          if (uv != null) parts.push('UV ' + Math.round(uv));
          if (hum != null) parts.push(Math.round(hum) + '% RH');
          return `<span style="font-size:13px;opacity:.75;">${parts.join(' &middot; ')}</span>`;
        ]]]
  hv_calendar:
    template: hv_base
    show_icon: false
    show_name: false
    show_state: false
    variables:
      calendars: []
      detail: false
      max: 0
    tap_action:
      action: navigate
      navigation_path: '#calendar'
    styles:
      card:
      - padding: 12px 20px
      grid:
      - grid-template-areas: '"events"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      custom_fields:
        events:
        - justify-self: stretch
        - align-self: start
        - min-width: '0'
    custom_fields:
      events: |
        [[[
          const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
          const parse = (s) => { if (!s) return null; const d = new Date(String(s).replace(' ', 'T')); return isNaN(d) ? null : d; };
          const now = new Date();
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          const dayLabel = (d) => {
            const diff = Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today) / 86400000);
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Tomorrow';
            return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
          };
          const timeLabel = (d) => (d ? d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '');
          const rows = (variables.calendars || []).map((cal) => {
            const st = states[cal.entity];
            const a = st ? st.attributes : {};
            const start = parse(a.start_time);
            const end = parse(a.end_time);
            const live = !!(st && st.state === 'on');
            let when = '';
            if (live) when = a.all_day ? 'Now · All day' : 'Now · until ' + timeLabel(end);
            else if (start) when = dayLabel(start) + (a.all_day ? ' · All day' : ' · ' + timeLabel(start));
            return { cal: cal, title: a.message, where: a.location, when: when,
                     key: live ? 0 : (start ? start.getTime() : Number.MAX_VALUE) };
          });
          rows.sort((x, y) => x.key - y.key);
          if (Number(variables.max) > 0) rows.length = Math.min(rows.length, Number(variables.max));
          const big = !!variables.detail;
          const line = (r) => `
            <div style="display:flex;align-items:${big ? 'flex-start' : 'center'};gap:10px;min-width:0;">
              <span style="flex:none;width:10px;height:10px;border-radius:50%;margin-top:${big ? '7px' : '0'};background:${r.cal.color || '#FF9F0A'};"></span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:${big ? 17 : 14}px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                  ${r.title ? esc(r.title) : '<span style="opacity:.55;">No upcoming events</span>'}</div>
                ${big ? `<div style="font-size:12px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.cal.name || '')}${r.where ? ' · ' + esc(r.where) : ''}</div>` : ''}
              </div>
              <span style="flex:none;font-size:${big ? 13 : 12}px;opacity:.7;">${esc(r.when)}</span>
            </div>`;
          return `
            <div style="display:flex;flex-direction:column;gap:${big ? 12 : 6}px;color:#FFFFFF;text-align:left;">
              <div style="font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.6;text-transform:uppercase;">Up next</div>
              ${rows.map(line).join('')}
            </div>`;
        ]]]
  hv_photo:
    show_icon: false
    show_name: false
    show_state: false
    triggers_update:
    - sensor.time
    variables:
      folder: /local/homeview/slideshow
      count: 1
      minutes: 2
    tap_action:
      action: none
    styles:
      card:
      - padding: 0px
      - border: none
      - border-radius: 24px
      - overflow: hidden
      - background-color: rgba(0, 0, 0, 0.30)
      - background-size: cover
      - background-position: center
      - background-repeat: no-repeat
      - background-image: |
          [[[
            const count = Math.max(1, Number(variables.count) || 1);
            const step = Math.floor(Date.now() / 60000 / (Number(variables.minutes) || 2));
            const n = ((step * 7919) % count) + 1;
            const name = 'photo' + String(n).padStart(3, '0') + '.jpg';
            return `url("${variables.folder}/${name}")`;
          ]]]
views:
- title: Widgets
  path: widgets
  icon: mdi:view-dashboard-variant
  type: panel
  background: 'radial-gradient(900px 700px at 12% 8%, rgba(56, 97, 196, 0.55) 0%, rgba(0, 0, 0, 0) 60%), radial-gradient(800px 650px at 92% 88%, rgba(150, 64, 120, 0.45) 0%, rgba(0, 0, 0, 0) 55%), linear-gradient(160deg, #0B1020 0%, #151B2B 100%)'
  cards:
  - type: vertical-stack
    cards:
    - type: custom:button-card
      template: hv_layout
      styles:
        grid:
        - grid-template-areas: '"date photo" "clock photo" "wx cal"'
        - grid-template-columns: 300px 1fr
        - grid-template-rows: 125px 310px 245px
        custom_fields:
          date:
          - min-width: '0'
          - min-height: '0'
          clock:
          - min-width: '0'
          - min-height: '0'
          photo:
          - min-width: '0'
          - min-height: '0'
          wx:
          - min-width: '0'
          - min-height: '0'
          cal:
          - min-width: '0'
          - min-height: '0'
      custom_fields:
        date:
          card:
            type: custom:button-card
            template: hv_date
            styles:
              card:
              - height: 125px
        clock:
          card:
            type: custom:button-card
            template: hv_clock
            variables:
              size: 270
            styles:
              card:
              - height: 310px
        photo:
          card:
            type: custom:button-card
            template: hv_photo
            variables:
              folder: /local/homeview/slideshow
              count: 60
              minutes: 2
            styles:
              card:
              - height: 447px
        wx:
          card:
            type: custom:button-card
            template: hv_weather
            entity: weather.your_weather
            variables:
              city: Your City
              uv_entity: weather.forecast_home
            styles:
              card:
              - height: 245px
        cal:
          card:
            type: custom:button-card
            template: hv_calendar
            variables:
              calendars:
              - entity: calendar.your_calendar_1
                name: Calendar 1
                color: '#FF9F0A'
              - entity: calendar.your_calendar_2
                name: Calendar 2
                color: '#30D158'
              detail: true
              max: 3
            triggers_update:
            - calendar.your_calendar_1
            - calendar.your_calendar_2
            - sensor.date
            styles:
              card:
              - height: 245px
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#weather'
        name: Weather
        icon: mdi:weather-partly-cloudy
        width_desktop: 640px
        bg_opacity: '94'
        bg_blur: '0'
      - type: weather-forecast
        entity: weather.your_weather
        forecast_type: hourly
        show_current: true
        show_forecast: true
      - type: weather-forecast
        entity: weather.your_weather
        forecast_type: daily
        show_current: false
        show_forecast: true
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#calendar'
        name: Upcoming week
        icon: mdi:calendar-month
        width_desktop: 760px
        bg_opacity: '94'
        bg_blur: '0'
      - type: calendar
        initial_view: listWeek
        entities:
        - calendar.your_calendar_1
        - calendar.your_calendar_2
    - type: vertical-stack
      cards:
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#doorbell'
        name: Front door
        icon: mdi:doorbell-video
        width_desktop: 900px
        bg_opacity: '94'
        bg_blur: '0'
        trigger:
        - condition: state
          entity: input_boolean.homeview_doorbell_popup
          state: 'on'
        trigger_close: true
        auto_close: '45000'
      - type: horizontal-stack
        cards:
        - type: picture-entity
          entity: camera.your_doorbell_high
          camera_view: live
          show_name: false
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
        - type: picture-entity
          entity: camera.your_package_camera
          camera_view: auto
          name: Package
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
      - type: grid
        columns: 3
        square: false
        cards:
        - type: custom:button-card
          template:
          - hv_tile
          - hv_tile_small
          entity: lock.your_front_door_lock
          tap_action:
            action: toggle
            haptic: light
            confirmation:
              text: '[[[ return (entity.state === ''locked'' ? ''Unlock'' : ''Lock'') + '' '' + entity.attributes.friendly_name + ''?''; ]]]'
        - type: custom:button-card
          template:
          - hv_tile
          - hv_tile_small
          entity: cover.your_garage_door
          tap_action:
            action: toggle
            haptic: light
            confirmation:
