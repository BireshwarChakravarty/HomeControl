# HomeView package - GENERATED by homeview/build_dashboard.py.
# Copy to /config/packages/homeview.yaml, then Developer tools > YAML > Check configuration
# and restart Home Assistant. (Packages must be enabled once, see docs/SETUP.md.)
input_boolean:
  homeview_screensaver:
    name: HomeView Screensaver
    icon: mdi:monitor-shimmer
  homeview_kiosk:
    name: HomeView Kiosk
    icon: mdi:fullscreen
  homeview_cam_1_alert:
    name: HomeView Camera 1 Alert
    icon: mdi:cctv
  homeview_cam_2_alert:
    name: HomeView Camera 2 Alert
    icon: mdi:cctv
template:
- triggers:
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
  sensor:
  - name: HomeView Minute
    unique_id: homeview_minute
    icon: mdi:clock-outline
    state: '{{ now().strftime(''%H:%M'') }}'
  - name: HomeView Date
    unique_id: homeview_date
    icon: mdi:calendar-today
    state: '{{ now().date() | string }}'
- triggers:
  - trigger: time_pattern
    minutes: /30
  - trigger: homeassistant
    event: start
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: fc
  sensor:
  - name: HomeView Weather Today
    unique_id: homeview_weather_today
    icon: mdi:weather-partly-cloudy
    state: '{{ (fc[''weather.forecast_home''].forecast | default([]) | first | default({}, true)).condition | default(''unknown'') }}'
    attributes:
      high: '{{ (fc[''weather.forecast_home''].forecast | default([]) | first | default({}, true)).temperature | default(none) }}'
      low: '{{ (fc[''weather.forecast_home''].forecast | default([]) | first | default({}, true)).templow | default(none) }}'
      rain_chance: '{{ (fc[''weather.forecast_home''].forecast | default([]) | first | default({}, true)).precipitation_probability | default(none) }}'
      rain_mm: '{{ (fc[''weather.forecast_home''].forecast | default([]) | first | default({}, true)).precipitation | default(none) }}'
script:
  homeview_play_pause:
    alias: HomeView - Play / pause music
    description: Pauses Spotify, or starts it on the Echo if it isn't playing there yet.
    mode: single
    icon: mdi:play-pause
    sequence:
    - if:
      - condition: state
        entity_id: media_player.spotify_your_name
        state: playing
      then:
      - action: media_player.media_pause
        target:
          entity_id: media_player.spotify_your_name
      else:
      - if:
        - condition: template
          value_template: '{{ state_attr(''media_player.spotify_your_name'', ''source'') != "Your Echo Name" }}'
        then:
        - action: media_player.select_source
          target:
            entity_id: media_player.spotify_your_name
          data:
            source: Your Echo Name
          continue_on_error: true
        - delay:
            seconds: 2
      - if:
        - condition: not
          conditions:
          - condition: state
            entity_id: media_player.spotify_your_name
            state: playing
        then:
        - action: media_player.media_play
          target:
            entity_id: media_player.spotify_your_name
          continue_on_error: true
automation:
- id: homeview_camera_1_alert
  alias: HomeView - Camera 1 alert on iPad
  description: Wakes the iPad and shows this camera live for 30 seconds.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.your_camera_1_motion
    from: 'off'
    to: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.homeview_screensaver
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.homeview_cam_1_alert
  - delay:
      seconds: 30
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.homeview_cam_1_alert
- id: homeview_camera_2_alert
  alias: HomeView - Camera 2 alert on iPad
  description: Wakes the iPad and shows this camera live for 30 seconds.
  mode: restart
  triggers:
  - trigger: state
    entity_id: binary_sensor.your_camera_2_motion
    from: 'off'
    to: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.homeview_screensaver
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.homeview_cam_2_alert
  - delay:
      seconds: 30
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.homeview_cam_2_alert
