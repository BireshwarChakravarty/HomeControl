# ==============================================================================
# HomeView iPad panel: THE ONE FILE YOU EDIT
# ------------------------------------------------------------------------------
# After you add your devices to Home Assistant (docs/SETUP.md, part B), replace
# every value containing "your_" with the real entity ID:
#   Settings -> Devices & services -> Entities -> click the entity -> cog icon
# Names on screen come from Home Assistant (= the names in your Atomberg, Tapo
# and Smart Life apps). Add  name: ...  to any item to override.
# Then run:   python3 homeview/build_dashboard.py
# ==============================================================================

dashboard:
  url_path: homeview          # Settings -> Dashboards -> Add dashboard -> URL
  accent: "#FF3B30"           # the red used for dots, labels and the clock colon
  glass_blur: true            # false = flat tiles, no blur (faster if the iPad lags)
  background: >-
    radial-gradient(circle, rgba(255, 255, 255, 0.075) 1px, rgba(0, 0, 0, 0) 1.6px) 0 0 / 16px 16px,
    radial-gradient(1100px 700px at 15% 0%, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0) 70%),
    #050505

# Created automatically by Home Assistant during onboarding (Met.no, uses your
# home location). The build also makes sensor.homeview_weather_today for the
# day's high / low / rain.
weather:
  entity: weather.forecast_home

# iCloud calendars via the CalDAV integration. One line per calendar you want.
calendars:
  - entity: calendar.your_icloud_calendar
    color: "#FF3B30"
  # - entity: calendar.your_second_calendar
  #   color: "#30D158"

# Spotify Premium -> Amazon Echo (via Spotify Connect)
music:
  player: media_player.spotify_your_name     # created by the Spotify integration
  speaker: "Your Echo Name"                  # exactly as the Echo appears in Spotify's device list

# Atomberg fans (speed dots adapt to each fan's number of speeds)
fans:
  - entity: fan.your_atomberg_fan_1
  - entity: fan.your_atomberg_fan_2
  - entity: fan.your_atomberg_fan_3

lights:
  - entity: light.your_tapo_strip
    icon: mdi:led-strip-variant
  - entity: light.your_wipro_tubelight
    icon: mdi:lightbulb-fluorescent-tube-outline

# Tapo cameras (via "Tapo: Cameras Control"). snapshot = SD stream (light),
# live = HD stream (pop-up). alert_sensor opens the camera full-screen on the
# iPad when it fires: use a person-detection sensor if your camera has one,
# otherwise its motion sensor. Delete alert_sensor to turn alerts off.
cameras:
  - snapshot: camera.your_camera_1_sd_stream
    live: camera.your_camera_1_hd_stream
    alert_sensor: binary_sensor.your_camera_1_motion
  - snapshot: camera.your_camera_2_sd_stream
    live: camera.your_camera_2_hd_stream
    alert_sensor: binary_sensor.your_camera_2_motion
